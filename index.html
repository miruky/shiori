<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="書籍の一節を組版の整ったSVG引用カードにするジェネレータ。禁則処理つきの折り返し、縦書き対応、PNG書き出し、URL共有。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1815" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <title>shiori — 引用カード生成器</title>
    <script>
      // 描画前にテーマを確定させ、ちらつきを防ぐ。
      (function () {
        try {
          var pref = localStorage.getItem('shiori:theme') || 'auto';
          var dark =
            pref === 'dark' ||
            (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
